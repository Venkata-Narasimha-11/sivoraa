name: SIVORA Luxe DevOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend

jobs:
  # ==============================================================================
  # Job 1: Backend Automated Testing & Linting (Python 3.11 + Pytest)
  # ==============================================================================
  backend-ci:
    name: Backend Pytest & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11 Runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install System & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev build-essential curl

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest-cov

      - name: Run Backend Linting & Syntax Checks (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treat all errors as warnings
          flake8 app --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Run Automated Pytest Test Suite
        env:
          USE_SQLITE_FALLBACK: "True"
          ENVIRONMENT: "testing"
          SECRET_KEY: "ci-test-secret-key-at-least-32-chars-long"
        run: |
          pytest tests/test_day22_ai_project.py tests/test_day23_devops.py -v --tb=short

      - name: Upload Backend Test Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/.pytest_cache/

  # ==============================================================================
  # Job 2: Frontend Automated Testing & Build (Node 20 + TypeScript + Vitest)
  # ==============================================================================
  frontend-ci:
    name: Frontend TypeScript, Vitest & Vite Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: 1. Strict TypeScript Validation
        run: npm run typecheck

      - name: 2. Run Vitest Unit & Integration Tests
        run: npm run test:run

      - name: 3. Compile Production Vite Bundle
        run: npm run build

      - name: Upload Production Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  # ==============================================================================
  # Job 3: Docker Compose Stack & Multi-Stage Dockerfile Lint/Validation
  # ==============================================================================
  docker-validation:
    name: Dockerfile & Compose Syntax Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
          echo "Docker Compose file syntax is valid!"

      - name: Validate Backend Multi-Stage Dockerfile
        run: |
          test -f backend/Dockerfile
          grep -q "AS builder" backend/Dockerfile
          grep -q "AS runtime" backend/Dockerfile
          grep -q "appuser" backend/Dockerfile
          echo "Backend Dockerfile conforms to multi-stage & non-root standards!"

      - name: Validate Frontend Multi-Stage Dockerfile
        run: |
          test -f frontend/Dockerfile
          grep -q "AS builder" frontend/Dockerfile
          grep -q "AS runner" frontend/Dockerfile
          echo "Frontend Dockerfile conforms to multi-stage Nginx standards!"

  # ==============================================================================
  # Job 4: Build & Push Production Container Images (GHCR)
  # ==============================================================================
  docker-build-push:
    name: Docker Multi-Stage Build & Image Push
    needs: [backend-ci, frontend-ci, docker-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags, Labels) for Backend Image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract Metadata for Frontend Image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build & Push Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
